# CI (docs/12-testing.md): lint → types → tests → image build. Merge only on green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        # Real PostgreSQL + TimescaleDB: RLS and hypertables must be tested for real (docs/12).
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: termolink
          POSTGRES_PASSWORD: termolink
          POSTGRES_DB: termolink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U termolink -d termolink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_ENV: dev
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DB_ROLE: admin
      DATABASE_URL: postgres://termolink:termolink@localhost:5432/termolink
      DB_APP_PASSWORD: termolink_app
      TOKEN_MASTER_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2ISE=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        # Same source of truth as backend/Dockerfile: dependency lists from pyproject.toml.
        run: |
          python -c "import tomllib;p=tomllib.load(open('pyproject.toml','rb'))['project'];print(*(p['dependencies']+p['optional-dependencies']['dev']),sep=chr(10))" > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Pytest with coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: pip-audit
        # Advisory until stage 6 hardening; failures are visible but do not block (docs/08).
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: false
          tags: termolink-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: false
          tags: termolink-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Compose config sanity
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config --quiet
